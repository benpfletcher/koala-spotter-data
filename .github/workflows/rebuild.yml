name: Rebuild koala snapshot
on:
  schedule:
    - cron: '17 18 * * *'   # 04:17 Sydney time, daily
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build snapshot from NSW BioNet
        run: node tools/build-snapshot.mjs out
      - name: Replace published files
        run: |
          rm -rf p a meta.json latest.json
          mv out/* . && rmdir out
      - name: Commit and push
        run: |
          git config user.name "koala-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Snapshot $(date -u +%Y-%m-%d)" || echo "No changes"
          git push
